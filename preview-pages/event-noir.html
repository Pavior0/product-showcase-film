<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<title>event-noir</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
html,body{margin:0;padding:0;background:#000}
.stage{position:relative;width:1920px;height:1080px;background:#0c0c0c;color:#f0f0f0;overflow:hidden;font-family:"Inter", Helvetica, Arial, sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;padding:0; justify-content:center;}
.events{position:absolute;inset:0;pointer-events:none}
.evt{position:absolute;font-family:"IBM Plex Mono", ui-monospace, monospace;font-size:16px;white-space:nowrap;opacity:.88}
.evt.text{color:#f0f0f0}.evt.muted{color:#6e6e6e}.evt.accent{color:#381cc8}
.center{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:40px;width:min(720px,92%)}
.card{width:100%;background:#d7d7d7;color:#0c0c0c;border-radius:14px;box-shadow:0 24px 80px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.04);padding:28px 32px;border:1px solid transparent}
.card-dark{color:#f0f0f0}
.meta{font-family:"IBM Plex Mono", ui-monospace, monospace;font-size:12px;letter-spacing:0.02em;text-transform:none;color:#6e6e6e;margin-bottom:22px;display:flex;justify-content:space-between;align-items:baseline}
.meta-plain{display:block;margin-bottom:18px}
.title{font-family:"Inter", Helvetica, Arial, sans-serif;font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.2;margin:0 0 12px;color:inherit}
.body{font-size:17px;line-height:1.45;margin:0;color:#3a3a3a}
.row{display:flex;align-items:center;gap:16px;font-family:"IBM Plex Mono", ui-monospace, monospace;font-size:16px;margin:14px 0}
.row.dim{opacity:.55}.code{flex:0 0 auto}
.bar{height:6px;border-radius:3px;background:#381cc8;flex:0 0 auto}
.bar.short{width:48px}.bar.long{width:160px;background:#9a9a9a}
.ok{margin-left:auto;color:#381cc8;font-weight:500}
.pill{display:inline-block;margin-top:22px;background:#0c0c0c;color:#f0f0f0;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600}
.term-line{font-family:"IBM Plex Mono", ui-monospace, monospace;font-size:18px;line-height:1.7}
.prompt{color:#381cc8;margin-right:10px}.out{color:#6e6e6e;padding-left:28px}
.acc,.caret{color:#381cc8}
.caption{font-family:"Inter", Helvetica, Arial, sans-serif;font-size:56px;font-weight:600;letter-spacing:-0.02em;line-height:1.12;text-align:center;max-width:100%}
.caption .hi{color:#f0f0f0}.caption .mu{color:#6e6e6e;font-weight:500}
.grain{position:absolute;inset:0;z-index:50;pointer-events:none;opacity:0.22;mix-blend-mode:overlay;background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27240%27%20height%3D%27240%27%3E%3Cfilter%20id%3D%27g%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%270.65%27%20numOctaves%3D%274%27%20stitchTiles%3D%27stitch%27%20seed%3D%277%27/%3E%3C/filter%3E%3Crect%20width%3D%27100%25%27%20height%3D%27100%25%27%20filter%3D%27url%28%2523g%29%27/%3E%3C/svg%3E");background-size:240px 240px}
.scan{position:absolute;inset:0;z-index:51;pointer-events:none;opacity:0;background:repeating-linear-gradient(to bottom,transparent 0 2px,rgba(0,0,0,.35) 3px);mix-blend-mode:multiply}
.vignette{position:absolute;inset:0;z-index:52;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,0.35) 100%)}
</style></head><body>
<div class="stage" data-theme="event-noir">
  <div class="events"><div class="evt text" style="left:72px;top:120px">tokens.out +1,204</div>
<div class="evt accent" style="left:1380px;top:160px">credits.topup +5,000</div>
<div class="evt muted" style="left:180px;top:780px">check(&quot;credits&quot;)</div>
<div class="evt accent" style="left:1600px;top:820px">0ms</div>
<div class="evt text" style="left:1100px;top:90px">tool.call +1</div>
<div class="evt muted" style="left:860px;top:200px">evt_1c07</div>
<div class="evt accent" style="left:240px;top:920px">seat.add +1</div>
<div class="evt muted" style="left:700px;top:960px">{ plan: &quot;pro&quot; }</div></div>
  <div class="center">
    <div class="card">
      <div class="meta"><span>Request</span><span>POST /v1/complete</span></div>
      <div class="row"><span class="code">check("credits")</span><span class="bar short"></span><span class="ok">allowed · 0 ms</span></div>
      <div class="row dim"><span class="code">llm.completion</span><span class="bar long"></span><span>877 ms</span></div>
  </div>
    <div class="caption"><span class="hi">Check it</span> <span class="mu">Answers in your process, in 0 ms.</span></div>
  </div>
  <div class="grain"></div><div class="scan"></div><div class="vignette"></div>
</div></body></html>
