<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<title>social-reel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
html,body{margin:0;padding:0;background:#000}
.stage{position:relative;width:1080px;height:1920px;background:#050505;color:#ffffff;overflow:hidden;font-family:"Inter", Helvetica, Arial, sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;padding:160px 72px 220px; justify-content:center;}
.events{position:absolute;inset:0;pointer-events:none}
.evt{position:absolute;font-family:"IBM Plex Mono", ui-monospace, monospace;font-size:16px;white-space:nowrap;opacity:.88}
.evt.text{color:#ffffff}.evt.muted{color:#8a8a8a}.evt.accent{color:#ff3b5c}
.center{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:48px;width:min(900px,92%)}
.card{width:100%;background:#f5f5f5;color:#050505;border-radius:20px;box-shadow:0 32px 72px rgba(0,0,0,0.6);padding:28px;border:1px solid transparent}
.card-dark{color:#ffffff}
.meta{font-family:"IBM Plex Mono", ui-monospace, monospace;font-size:12px;letter-spacing:0.04em;text-transform:none;color:#8a8a8a;margin-bottom:22px;display:flex;justify-content:space-between;align-items:baseline}
.meta-plain{display:block;margin-bottom:18px}
.title{font-family:"Inter", Helvetica, Arial, sans-serif;font-size:36px;font-weight:600;letter-spacing:-.02em;line-height:1.2;margin:0 0 12px;color:inherit}
.body{font-size:20px;line-height:1.45;margin:0;color:#8a8a8a}
.row{display:flex;align-items:center;gap:16px;font-family:"IBM Plex Mono", ui-monospace, monospace;font-size:16px;margin:14px 0}
.row.dim{opacity:.55}.code{flex:0 0 auto}
.bar{height:6px;border-radius:3px;background:#ff3b5c;flex:0 0 auto}
.bar.short{width:48px}.bar.long{width:160px;background:#9a9a9a}
.ok{margin-left:auto;color:#ff3b5c;font-weight:500}
.pill{display:inline-block;margin-top:22px;background:#050505;color:#ffffff;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600}
.term-line{font-family:"IBM Plex Mono", ui-monospace, monospace;font-size:18px;line-height:1.7}
.prompt{color:#ff3b5c;margin-right:10px}.out{color:#8a8a8a;padding-left:28px}
.acc,.caret{color:#ff3b5c}
.caption{font-family:"Inter", Helvetica, Arial, sans-serif;font-size:72px;font-weight:700;letter-spacing:-0.03em;line-height:1.12;text-align:center;max-width:100%}
.caption .hi{color:#ffffff}.caption .mu{color:#8a8a8a;font-weight:500}
.grain{position:absolute;inset:0;z-index:50;pointer-events:none;opacity:0.16;mix-blend-mode:overlay;background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27240%27%20height%3D%27240%27%3E%3Cfilter%20id%3D%27g%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%270.75%27%20numOctaves%3D%273%27%20stitchTiles%3D%27stitch%27%20seed%3D%2723%27/%3E%3C/filter%3E%3Crect%20width%3D%27100%25%27%20height%3D%27100%25%27%20filter%3D%27url%28%2523g%29%27/%3E%3C/svg%3E");background-size:240px 240px}
.scan{position:absolute;inset:0;z-index:51;pointer-events:none;opacity:0;background:repeating-linear-gradient(to bottom,transparent 0 2px,rgba(0,0,0,.35) 3px);mix-blend-mode:multiply}
.vignette{position:absolute;inset:0;z-index:52;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,0.40) 100%)}
</style></head><body>
<div class="stage" data-theme="social-reel">
  <div class="events"><div class="evt accent" style="left:80px;top:160px">live · 2.4k</div></div>
  <div class="center">
    <div class="card">
      <div class="meta meta-plain">Credits</div>
      <h2 class="title">1,204 left</h2>
      <p class="body">Top up in one tap. Your agents spend from the same balance.</p>
  </div>
    <div class="caption"><span class="hi">Top up</span><br><span class="mu" style="font-size:36px;font-weight:500">before they run dry.</span></div>
  </div>
  <div class="grain"></div><div class="scan"></div><div class="vignette"></div>
</div></body></html>
