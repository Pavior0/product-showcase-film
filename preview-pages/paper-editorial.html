<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<title>paper-editorial</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet"/>
<style>
html,body{margin:0;padding:0;background:#000}
.stage{position:relative;width:1920px;height:1080px;background:#f3efe6;color:#1c1a17;overflow:hidden;font-family:"Inter", Helvetica, Arial, sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;padding:0; justify-content:center;}
.events{position:absolute;inset:0;pointer-events:none}
.evt{position:absolute;font-family:"IBM Plex Mono", ui-monospace, monospace;font-size:15px;white-space:nowrap;opacity:.88}
.evt.text{color:#1c1a17}.evt.muted{color:#7a7368}.evt.accent{color:#c45c26}
.center{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:40px;width:min(680px,92%)}
.card{width:100%;background:#fffcf7;color:#1c1a17;border-radius:10px;box-shadow:0 18px 48px rgba(28,26,23,0.08), 0 0 0 1px rgba(28,26,23,0.06);padding:32px 36px;border:1px solid transparent}
.card-dark{color:#1c1a17}
.meta{font-family:"IBM Plex Mono", ui-monospace, monospace;font-size:12px;letter-spacing:0.04em;text-transform:none;color:#7a7368;margin-bottom:22px;display:flex;justify-content:space-between;align-items:baseline}
.meta-plain{display:block;margin-bottom:18px}
.title{font-family:"Inter", Helvetica, Arial, sans-serif;font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.2;margin:0 0 12px;color:inherit}
.body{font-size:17px;line-height:1.45;margin:0;color:#7a7368}
.row{display:flex;align-items:center;gap:16px;font-family:"IBM Plex Mono", ui-monospace, monospace;font-size:16px;margin:14px 0}
.row.dim{opacity:.55}.code{flex:0 0 auto}
.bar{height:6px;border-radius:3px;background:#c45c26;flex:0 0 auto}
.bar.short{width:48px}.bar.long{width:160px;background:#9a9a9a}
.ok{margin-left:auto;color:#c45c26;font-weight:500}
.pill{display:inline-block;margin-top:22px;background:#f3efe6;color:#1c1a17;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600}
.term-line{font-family:"IBM Plex Mono", ui-monospace, monospace;font-size:18px;line-height:1.7}
.prompt{color:#c45c26;margin-right:10px}.out{color:#7a7368;padding-left:28px}
.acc,.caret{color:#c45c26}
.caption{font-family:"Source Serif 4", Georgia, serif;font-size:64px;font-weight:600;letter-spacing:-0.01em;line-height:1.12;text-align:center;max-width:100%}
.caption .hi{color:#1c1a17}.caption .mu{color:#7a7368;font-weight:500}
.grain{position:absolute;inset:0;z-index:50;pointer-events:none;opacity:0.10;mix-blend-mode:overlay;background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27240%27%20height%3D%27240%27%3E%3Cfilter%20id%3D%27g%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%270.9%27%20numOctaves%3D%273%27%20stitchTiles%3D%27stitch%27%20seed%3D%2711%27/%3E%3C/filter%3E%3Crect%20width%3D%27100%25%27%20height%3D%27100%25%27%20filter%3D%27url%28%2523g%29%27/%3E%3C/svg%3E");background-size:240px 240px}
.scan{position:absolute;inset:0;z-index:51;pointer-events:none;opacity:0;background:repeating-linear-gradient(to bottom,transparent 0 2px,rgba(0,0,0,.35) 3px);mix-blend-mode:multiply}
.vignette{position:absolute;inset:0;z-index:52;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,0.12) 100%)}
</style></head><body>
<div class="stage" data-theme="paper-editorial">
  <div class="events"><div class="evt muted" style="left:120px;top:140px">state = fn(events)</div>
<div class="evt accent" style="left:1500px;top:200px">draft.saved</div>
<div class="evt muted" style="left:1600px;top:900px">revision · 04</div></div>
  <div class="center">
    <div class="card">
      <div class="meta meta-plain">Chapter 02</div>
      <h2 class="title">Write once.<br>Publish everywhere.</h2>
      <p class="body">One document becomes the site, the newsletter, and the PDF. Edit the source; every surface updates.</p>
  </div>
    <div class="caption"><span class="hi">Ship it</span> <span class="mu">One file. Every surface.</span></div>
  </div>
  <div class="grain"></div><div class="scan"></div><div class="vignette"></div>
</div></body></html>
