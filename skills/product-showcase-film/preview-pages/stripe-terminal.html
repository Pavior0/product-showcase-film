<!doctype html><html lang="en"><head><meta charset="utf-8"/><title>stripe-terminal</title><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
html,body{margin:0}
.stage{position:relative;width:1920px;height:1080px;background:#eeefed;overflow:hidden;-webkit-font-smoothing:antialiased}
.win{position:absolute;left:240px;top:110px;width:1440px;border-radius:22px;overflow:hidden;background:#f7f7f6;box-shadow:0 40px 100px rgba(18,16,34,.22),0 0 0 1px rgba(0,0,0,.06)}
.bar{height:56px;background:radial-gradient(circle 8px at 30px 28px,#ff5f57 98%,transparent),radial-gradient(circle 8px at 58px 28px,#febc2e 98%,transparent),radial-gradient(circle 8px at 86px 28px,#28c840 98%,transparent),#f2f2f0}
.scr{margin:0 14px 14px;border-radius:14px;background:#121022;padding:44px 52px;min-height:700px;box-sizing:border-box;font:400 30px/1.6 "JetBrains Mono",monospace;color:#dddaeb;white-space:pre}
.p{color:#644dda}.ok{color:#7ee0a5}.mu{color:#767484}
.box{margin-top:22px;width:760px;border:1.5px solid #4f3da9;border-radius:8px;padding:18px 26px;white-space:normal}
.box .t{color:#644dda;margin-bottom:8px}.kv{display:flex;justify-content:space-between}
.modal{position:absolute;left:1180px;top:560px;width:560px;background:#fcfcfc;border-radius:18px;box-shadow:0 30px 80px rgba(18,16,34,.3);padding:34px 36px;font-family:Inter,sans-serif;color:#1d1b2c;box-sizing:border-box}
.modal h4{margin:0 0 6px;font-size:30px;font-weight:600}.modal p{margin:0 0 26px;color:#767484;font-size:22px}
.btn{background:#4822f2;color:#fff;border-radius:999px;text-align:center;padding:16px;font-size:24px;font-weight:600}
</style></head><body><div class="stage">
<div class="win"><div class="bar"></div><div class="scr"><span class="p">›</span> acme pay @studio_north 10.00 usd
<span class="ok">✓ Recipient found</span>
<span class="mu">  studio_north · verified</span><div class="box"><div class="t">Live mode transfer</div><div class="kv"><span class="mu">Amount</span><span>10.00 USD</span></div><div class="kv"><span class="mu">To</span><span>@studio_north</span></div><div class="kv"><span class="mu">Fee</span><span>0.00 USD</span></div></div></div></div>
<div class="modal"><h4>Requesting to pay $10.00</h4><p>studio_north · one-time transfer</p><div class="btn">Approve</div></div>
</div></body></html>
