<!doctype html><html lang="en"><head><meta charset="utf-8"/><title>linear-light</title><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
html,body{margin:0}
.stage{position:relative;width:1920px;height:1080px;background:#fbfdfc;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:#262626;-webkit-font-smoothing:antialiased}
.plate{position:absolute;left:160px;right:160px;top:120px;height:640px;background:#eff2f0;border-radius:28px}
.card{position:absolute;left:400px;top:200px;width:1120px;background:#fdfdfd;border:1px solid #dadada;border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 12px 40px rgba(0,0,0,.06)}
.hd{height:84px;display:flex;align-items:center;gap:18px;padding:0 32px;border-bottom:1px solid #ececec;font-size:28px;font-weight:600}
.hd .k{font-family:"Geist Mono",monospace;font-size:20px;color:#777a78;font-weight:400;margin-left:auto}
.row{display:flex;align-items:center;gap:20px;height:84px;padding:0 32px;font-size:26px;border-bottom:1px solid #f1f1f1}
.row:last-child{border-bottom:0}
.dot{width:14px;height:14px;border-radius:50%}
.m{margin-left:auto;color:#777a78;font-size:22px}
.chip{font-size:19px;color:#6b6fcd;border:1px solid #d9daf3;background:#f4f4fd;border-radius:999px;padding:6px 14px}
.ghost{position:absolute;left:400px;top:200px;width:1120px;height:430px;border-radius:16px;background:#fdfdfd;opacity:.35;filter:blur(8px);transform:translateY(16px)}
.cap{position:absolute;left:0;right:0;top:860px;text-align:center;font-size:80px;font-weight:600;letter-spacing:-.025em;line-height:1.1}
</style></head><body><div class="stage">
<div class="plate"></div><div class="ghost"></div>
<div class="card">
<div class="hd">Suggested by agent <span class="k">ENG-2140</span></div>
<div class="row"><span class="dot" style="background:#67c98a"></span>Duplicate of ENG-1182<span class="m">92% match</span></div>
<div class="row"><span class="dot" style="background:#e0b800"></span>Label: Performance<span class="chip">suggested</span><span class="m">accept ↵</span></div>
<div class="row"><span class="dot" style="background:#6b6fcd"></span>Assign: Mira K.<span class="m">owner of /sync</span></div>
<div class="row"><span class="dot" style="background:#df5765"></span>Priority: Urgent<span class="m">3 customer reports</span></div>
</div>
<div class="cap">Automate triage in your tracker</div>
</div></body></html>
